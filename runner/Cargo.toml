[package]
name = "forgity-runner"
version = "0.1.0"
edition = "2021"
description = "Forgity Studio Native Runner Daemon"
authors = ["Forgity Studio Team"]

[[bin]]
name = "forgity-runner"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive", "env"] }
tokio = { version = "1.43", features = ["full"] }
tonic = { version = "0.12", features = ["tls", "tls-roots"] }
prost = "0.13"
prost-types = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
colored = "2.2"
anyhow = "1.0"
thiserror = "2.0"
winreg = "0.52"
dirs = "6.0"

[build-dependencies]
tonic-build = "0.12"
prost-build = "0.13"
dirs = "6.0"
glob = "0.3"
