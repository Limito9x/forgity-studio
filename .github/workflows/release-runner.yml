name: Release Forgity Studio Desktop & Runner

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version_tag:
        description: "Release version (e.g. 1.0.0)"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  release-windows:
    name: Build & Publish Forgity Studio Desktop + Runner (Windows x64)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Extract Tag or Input Version
        id: get_version
        shell: pwsh
        run: |
          if ('${{ github.event_name }}' -eq 'workflow_dispatch' -and '${{ github.event.inputs.version_tag }}' -ne '') {
            $ver = '${{ github.event.inputs.version_tag }}'
          } else {
            $ver = '${{ github.ref_name }}'.TrimStart('v')
            if (-not $ver) { $ver = '0.1.0' }
          }
          Write-Host "Releasing version: $ver"
          "VERSION=$ver" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Setup Node.js & pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "pnpm"
          cache-dependency-path: app/pnpm-lock.yaml

      - name: Install Protoc
        uses: arduino/setup-protoc@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo Dependencies
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            runner -> runner/target
            app/src-tauri -> app/src-tauri/target

      - name: Build Forgity Runner Sidecar & Stage Binary
        shell: pwsh
        env:
          FORGITY_RUNNER_VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          ./app/scripts/stage-sidecar.ps1

      - name: Install Frontend Dependencies
        shell: pwsh
        run: |
          pnpm --dir app install --frozen-lockfile

      - name: Build & Publish Tauri Desktop App (with Updater)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          FORGITY_API_URL: ${{ vars.VITE_API_URL }}
        with:
          projectPath: app
          tagName: v${{ steps.get_version.outputs.VERSION }}
          releaseName: "Forgity Studio v${{ steps.get_version.outputs.VERSION }}"
          releaseBody: "Forgity Studio Desktop & Native Runner v${{ steps.get_version.outputs.VERSION }}"
          releaseDraft: false
          prerelease: false
