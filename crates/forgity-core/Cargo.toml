[package]
name = "forgity-core"
version = "0.1.0"
edition = "2021"
description = "Shared core contracts, workspace index, pipeline validator, and execution bundle builder for Forgity Studio"

[dependencies]
anyhow = "1.0"
hex = "0.4"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
sha2 = "0.10"
toml = "0.8"
